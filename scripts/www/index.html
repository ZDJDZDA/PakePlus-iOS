<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232735;
    --border: #2e3347;
    --text: #e4e6f0;
    --text2: #9ca3b8;
    --accent: #6c8cff;
    --accent2: #8b5cf6;
    --green: #34d399;
    --orange: #fb923c;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a1d27 0%, #232735 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }

  header h1 {
    font-size: 1.8rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: .5rem;
  }

  header p { color: var(--text2); font-size: .9rem; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    justify-content: center;
  }

  .filter-btn {
    padding: .4rem 1rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: .82rem;
    cursor: pointer;
    transition: all .2s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .search-wrap {
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }

  .search-wrap input {
    width: 100%;
    max-width: 480px;
    padding: .55rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: .9rem;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .section-title {
    font-size: 1.15rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  .section-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    transition: border-color .2s, transform .2s;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .provider-name {
    font-size: 1.05rem;
    font-weight: 600;
  }

  .provider-badge {
    font-size: .7rem;
    padding: .2rem .55rem;
    border-radius: 10px;
    background: rgba(108, 140, 255, .15);
    color: var(--accent);
  }

  .model-list { display: flex; flex-direction: column; gap: .6rem; }

  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border-radius: 10px;
    padding: .6rem .85rem;
    transition: background .2s;
  }

  .model-row:hover { background: rgba(108,140,255,.08); }

  .model-info { display: flex; flex-direction: column; gap: .15rem; }

  .model-name {
    font-size: .85rem;
    font-weight: 500;
  }

  .model-tag {
    font-size: .68rem;
    color: var(--text2);
  }

  .price-info {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-shrink: 0;
  }

  .price-block {
    text-align: right;
  }

  .price-val {
    font-size: .82rem;
    font-weight: 600;
    color: var(--green);
  }

  .price-val.high { color: var(--orange); }
  .price-val.premium { color: var(--red); }

  .price-label {
    font-size: .65rem;
    color: var(--text2);
  }

  .compare-bar {
    margin-top: 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
  }

  .compare-bar h3 { margin-bottom: 1rem; font-size: 1.05rem; }

  .chart-table {
    width: 100%;
    border-collapse: collapse;
  }

  .chart-table th {
    text-align: left;
    padding: .5rem .75rem;
    font-size: .78rem;
    color: var(--text2);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
  }

  .chart-table td {
    padding: .6rem .75rem;
    font-size: .82rem;
    border-bottom: 1px solid rgba(46,51,71,.5);
  }

  .chart-table tr:hover td { background: rgba(108,140,255,.05); }

  .trend-up { color: var(--red); }
  .trend-down { color: var(--green); }
  .trend-same { color: var(--text2); }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text2);
    font-size: .78rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  .note {
    background: rgba(251, 146, 60, .1);
    border: 1px solid rgba(251, 146, 60, .3);
    border-radius: 10px;
    padding: .75rem 1rem;
    margin-bottom: 1.5rem;
    font-size: .8rem;
    color: var(--orange);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    header h1 { font-size: 1.4rem; }
  }
</style>

</div>

<footer>

// ===== 渲染 =====
function priceClass(val) {
  if (val === 0) return '';
  if (val <= 5) return '';
  if (val <= 20) return 'high';
  return 'premium';
}

function trendIcon(t) {
  if (t === 'down') return '<span class="trend-down">↓ 降价</span>';
  if (t === 'up') return '<span class="trend-up">↑ 涨价</span>';
  if (t === 'new') return '<span style="color:var(--accent)">🆕 新</span>';
  return '<span class="trend-same">— 持平</span>';
}

        <span class="provider-badge">${p.badge}</span>
      </div>
      <div class="model-list">
        ${p.models.map(m => `
          <div class="model-row" data-cat="${m.cat}">
            <div class="model-info">
              <span class="model-name">${m.name}</span>
              <span class="model-tag">${m.tag} · ${m.ctx}</span>
            </div>
            <div class="price-info">
              <div class="price-block">
                <div class="price-val ${priceClass(m.inPrice)}">${m.inPrice === 0 ? '免费' : m.inPrice + ' 元'}</div>
                <div class="price-label">输入 / M tokens</div>
              </div>
              <div class="price-block">

              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

    { model: 'Step-1-200k', provider: '阶跃星辰', inP: 5, outP: 15, ctx: '200K', trend: 'same' },
  ];

  tbody.innerHTML = hotModels.map(m => `
    <tr>
      <td><strong>${m.model}</strong></td>
      <td>${m.provider}</td>
      <td class="${priceClass(m.inP)}">${m.inP === 0 ? '免费' : m.inP + ' 元'}</td>
      <td class="${priceClass(m.outP)}">${m.outP === 0 ? '免费' : m.outP + ' 元'}</td>
      <td>${m.ctx}</td>
      <td>${trendIcon(m.trend)}</td>
    </tr>
  `).join('');
}

// ===== 筛选 =====
let currentFilter = 'all';
let currentSearch = '';

function applyFilters() {
  const filtered = providers
    .map(p => ({
      ...p,
      models: p.models.filter(m => {
        const matchFilter = currentFilter === 'all' ||
          (currentFilter === 'free' && m.inPrice === 0) ||
          m.cat.includes(currentFilter);
        const matchSearch = !currentSearch ||
          m.name.toLowerCase().includes(currentSearch) ||
          p.name.toLowerCase().includes(currentSearch);
        return matchFilter && matchSearch;
      })
    }))
    .filter(p => p.models.length > 0);

  renderGrid(filtered);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase();
  applyFilters();
});

// ===== 初始化 =====
renderGrid(providers);
renderCompareTable();
</script>
</body>
</html>
